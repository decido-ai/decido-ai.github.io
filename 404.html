<style>

          --mono: ui-monospace, Menlo, "SF Mono", Consolas, monospace; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #141413; --ink: #ecebe7; --muted: #a6a39b; --rule: #34332f; --accent: #5b9bea; --accent-ink: #7fb2f0; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 18px/1.55 var(--serif); -webkit-font-smoothing: antialiased;
         display: flex; flex-direction: column; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 760px; width: 100%; margin: 0 auto; padding: 48px 28px; }
  .brand { font: 700 14px var(--mono); letter-spacing: .12em; }
  h1 { font-size: clamp(40px, 7vw, 68px); line-height: 1.04; letter-spacing: -.02em; margin: 28px 0 0; }
  h1 .accent { color: var(--accent); }
  p { color: var(--muted); font-size: clamp(19px, 2.3vw, 22px); margin: 20px 0 0; max-width: 620px; }
  .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
  a.btn { font: 600 14px var(--mono); padding: 12px 18px; border-radius: 8px; border: 1px solid var(--ink); color: var(--ink); text-decoration: none; }
  a.btn.primary { background: var(--ink); color: var(--paper); }
  a.btn:hover { opacity: .85; }
  footer { border-top: 1px solid var(--rule); padding: 22px 28px; font: 12px var(--mono); color: var(--muted); text-align: center; }
